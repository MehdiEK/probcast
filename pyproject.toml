[project]
name = "probcast"
version = "0.1.0"
description = "Evaluation and monitoring of probabilisitc forecasts"
readme = "README.md"
authors = [
    { name = "MehdiEK", email = "elkansoulimehdi@yahoo.fr" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
probcast = "probcast:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]