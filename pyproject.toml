
[project]
name = "probcast"
version = "0.1.0"
description = "Evaluation and monitoring of probabilisitc forecasts"
readme = "README.md"
authors = [
    { name = "MehdiEK", email = "elkansoulimehdi@yahoo.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.scripts]
probcast = "probcast:master"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "I",    # Import sorting
    "B",    # Bugbear
    "UP",   # Modern Python
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["probcast"]

[tool.coverage.report]
show_missing = true
fail_under = 40

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src/"]

[[tool.mypy.overrides]]
module = ["scipy.stats"]
ignore_missing_imports = true
